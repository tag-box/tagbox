name = "tagbox-storage"
main = "worker.mjs"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "tag-box/tagbox"
GITHUB_BRANCH = "main"
SITE_ORIGIN = "https://tag-box.github.io"
SITE_URL = "https://tag-box.github.io/tagbox/"
ADMIN_LOGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "tagbox-users"
database_id = "7aa8b47d-ada3-4a98-bad1-f69bf2615fc0"

# Secrets (set in Cloudflare, never here):
#   GITHUB_TOKEN    - repo Contents read/write token
#   SESSION_SECRET  - random string used to sign login sessions
#   SIGNUP_CODE     - required to create a new account
