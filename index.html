<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TagBox — 이미지 태그 검색</title>

<script>
try{
  document.documentElement.dataset.theme =
    localStorage.getItem('tagbox-theme') || 'dark';
}catch{
  document.documentElement.dataset.theme = 'dark';
}
</script>

<style>
:root{
  color-scheme:dark
}

:root[data-theme="light"]{
  color-scheme:light
}

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif
}

body{
  background:light-dark(#eef2f7,#0b0e12);
  color:light-dark(#18212f,#e9eef5)
}

#modeBanner{
  max-width:1180px;
  margin:20px auto 0;
  padding:14px 20px;
  border:1px solid light-dark(#d7dee8,#526075);
  border-radius:12px;
  background:light-dark(#fff,#111720);
  color:light-dark(#475569,#cbd5e1)
}

.app{
  min-height:100vh;
  background:light-dark(#f6f8fb,#0f141b);
  color:light-dark(#18212f,#e9eef5);
  padding:28px clamp(16px,4vw,56px)
}

.header{
  max-width:1180px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,#6d5dfc,#36cfc9);
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  font-size:20px
}

.brand h1{
  font-size:21px;
  margin:0
}

.brand p{
  margin:2px 0 0;
  color:#748093;
  font-size:13px
}

.stats{
  font-size:13px;
  color:#748093
}

.header-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap
}

.panel{
  max-width:1180px;
  margin:24px auto 0;
  background:light-dark(#fff,#171d26);
  border:1px solid light-dark(#e1e7ef,#283241);
  border-radius:22px;
  padding:18px;
  box-shadow:0 12px 35px rgba(0,0,0,.07)
}

.search{

}

.search input{
  flex:1;
  font-size:16px;
  padding:14px 16px;
  border:1px solid light-dark(#d7dee8,#334052);
  background:light-dark(#fafbfd,#111720);
  color:inherit;
  border-radius:14px;
  outline:none
}

.search input:focus{
  border-color:#6d5dfc;
  box-shadow:0 0 0 3px rgba(109,93,252,.14)
}

button{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  font-weight:750;
  cursor:pointer;

  color:white
}

button:hover{
  filter:brightness(.96)
}

.secondary{
  background:light-dark(#edf0f5,#242c38);
  color:inherit

.danger{
  background:#d94b4b;
  color:white
}

.danger:hover{
  background:#c63d3d;

}

.toolbar{
  display:flex;
  justify-content:space-between;

.chips{
  display:flex;

.chip{

.upload{

}

.upload input{

.grid{

  margin:20px auto;

.tag{

  }

<!-- 로그인 / 회원가입 -->

<div class="modal" id="authModal">

  <div class="dialog" style="width:min(430px,100%)">

    <button id="authClose" class="secondary" type="button" style="float:right">

      <button id="authLogin" type="button">로그인</button>

    <div class="hint">
      회원가입에는 가입 코드가 필요합니다.
      첫 번째로 가입한 계정이 관리자가 되며,
      비밀번호는 복구할 수 없으니 기억해주세요.

<div id="suggest" class="suggest"></div>


<script src="config.js"></script>
<script src="backend.js"></script>
<script>

const $ = id =>
  document.getElementById(id);


let items = [];

let current = null;

let tagList = [];


// =========================
// GitHub 로그인 세션
// 태그를 추가한 계정만 그 태그를 수정/삭제할 수 있음
// =========================

const TOKEN_KEY = 'tagbox-token';

let session = null;

function getToken(){
  try{
    return localStorage.getItem(TOKEN_KEY) || '';
  }catch{
    return '';
  }
}

function setToken(token){
  try{
    if(token){
      localStorage.setItem(TOKEN_KEY, token);
    }else{
      localStorage.removeItem(TOKEN_KEY);
    }
  }catch{}
}

function b64urlDecode(text){
  let s = String(text).replace(/-/g, '+').replace(/_/g, '/');
  while(s.length % 4){
    s += '=';
  }
  const bin = atob(s);
  return new TextDecoder().decode(
    Uint8Array.from(bin, c => c.charCodeAt(0))
  );
}

function decodeSession(token){
  if(!token){
    return null;
  }
  try{
    const payload =
      JSON.parse(b64urlDecode(token.split('.')[0]));
    if(!payload || !payload.exp || payload.exp < Date.now()){
      return null;
    }
    return payload;
  }catch{
    return null;
  }
}

function loadSession(){
  const token = getToken();
  session = decodeSession(token);
  if(!session && token){
    setToken('');
  }
}

function ownsTag(item, tag){
  // 브라우저 체험 모드에서는 소유권 구분이 필요 없음
  if(!window.tagboxShared){
    return true;
  }
  if(!session){
    return false;
  }
  if(session.adm){
    return true;
  }
  return String(session.uid) ===
    String((item.owners || {})[tag]);
}

function renderAuth(){
  const button = $('authBtn');

  if(!window.tagboxShared){
    button.style.display = 'none';
    return;
  }

  button.style.display = 'inline-block';

  if(session){
    button.textContent =
      `${session.login} · 로그아웃`;
    button.onclick = () => {
      setToken('');
      session = null;
      renderAuth();
      render();
      if($('modal').classList.contains('open')){
        renderModalTags();
      }
    };
  }else{
    button.textContent = '로그인 / 회원가입';
    button.onclick = openAuth;
  }
}

// =========================
// 화이트 / 다크 테마
// =========================

const THEME_KEY = 'tagbox-theme';

function currentTheme(){
  return document.documentElement.dataset.theme === 'light'
    ? 'light'
    : 'dark';
}

function renderThemeButton(){
  $('themeBtn').textContent =
    currentTheme() === 'light'
      ? '다크 모드'
      : '라이트 모드';
}

function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  try{
    localStorage.setItem(THEME_KEY, theme);
  }catch{}
  renderThemeButton();
}

$('themeBtn').onclick = () => {
  setTheme(
    currentTheme() === 'light'
      ? 'dark'
      : 'light'
  );
};

renderThemeButton();


function openAuth(){
  $('authUser').value = '';
  $('authPass').value = '';
  $('authCode').value = '';
  $('authModal').classList.add('open');
  $('authUser').focus();
}

function closeAuth(){
  $('authModal').classList.remove('open');
}

async function submitAuth(kind){
  const username = $('authUser').value.trim();
  const password = $('authPass').value;

  if(!username || !password){
    alert('아이디와 비밀번호를 입력해주세요.');
    return;
  }

  const code = $('authCode').value.trim();

  if(kind === 'register' && !code){
    alert('가입 코드를 입력해주세요.');
    return;
  }

  try{
    const result =
      kind === 'register'
        ? await window.tagboxAPI.register(username, password, code)
        : await window.tagboxAPI.login(username, password);

    if(!result || !result.token){
      throw new Error('로그인 응답이 올바르지 않습니다.');
    }

    setToken(result.token);
    loadSession();
    closeAuth();
    await load();

    if($('modal').classList.contains('open')){
      renderModalTags();
    }

  }catch(error){
    alert(
      (kind === 'register' ? '회원가입' : '로그인') +
      `에 실패했습니다.\n\n${error.message || error}`
    );
  }
}

$('authLogin').onclick = () => submitAuth('login');
$('authRegister').onclick = () => submitAuth('register');
$('authClose').onclick = closeAuth;

$('authModal').onclick = e => {
  if(e.target === $('authModal')){
    closeAuth();
  }
};

$('authPass').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    submitAuth('login');
  }
});

// 이미지 확대/이동 상태
let zoom = 1;
let panX = 0;
let panY = 0;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
let startPanX = 0;
let startPanY = 0;


// =========================
// 데이터 불러오기
// =========================

async function load(){

  try{

    loadSession();

    const saved =
      await window.tagboxAPI.loadData();


    items =
      saved.map(x => ({

        id:x.id,

        name:x.name,

        fileName:x.fileName,

        tags:
          Array.isArray(x.tags)
            ? [...x.tags]
            : [],

        owners:
          x.owners && typeof x.owners === 'object'
            ? {...x.owners}
            : {},

        src:x.path

      }));

  }catch(e){

    alert('목록을 불러오지 못했습니다: ' + (e.message || e));
    console.error(
      '데이터 불러오기 실패:',
      e
    );

    // 불러오기에 실패했다고
    // 기존 화면 데이터를 지우지 않음
    if(!Array.isArray(items)){
      items=[];
    }

  }

  render();

  renderAuth();

}


// =========================
// 화면 그리기
// =========================

function render(){

  const q =
    $('search')
      .value
      .trim()
      .toLowerCase();


  const terms =
    q
      .split(/\s+/)
      .filter(Boolean);


  const filtered =
    items.filter(x => {

      const hay =
        (
          x.name +
          ' ' +
          x.tags.join(' ')

      return terms.every(t =>

      );

    });


  const allTags = [
    ...new Set(
      items.flatMap(x =>
        Array.isArray(x.tags)
          ? x.tags

      )
    )

  tagList =
    [...allTags].sort(
      (a,b) => a.localeCompare(b, 'ko')
    );


  $('stats').textContent =
    `${items.length}개 이미지 · ${allTags.length}개 태그`;


  $('grid').innerHTML =
    filtered.length

        <article
          class="card"
          data-id="${esc(x.id)}"
        >

                ? `

                    alt=""
                  >
                `

                : `
                  <div class="placeholder">
                    🖼️
                  </div>
                `
            }

          </div>


          ${
            x.tags.length
              ? `
          <div class="body">

            <div class="tags">

              ${
                x.tags
                  .map(t =>
                    `
                    <span class="tag">
                      #${esc(t)}
                    </span>
                    `
                  )
                  .join('')
              }

            </div>

          </div>
          `
              : ''
          }

        </article>

      `).join('')

      :

      `

        <div class="empty">

          <div style="font-size:46px">
            🗂️
          </div>

          <h3>
            검색 결과가 없어요

          <p>
            이미지를 추가하거나
            검색어를 변경해보세요.
          </p>

        </div>

      `;


  // =========================
  // 태그 개수
  // =========================

  const counts = {};


  items
    .flatMap(x =>
      Array.isArray(x.tags)
        ? x.tags
        : []
    )
    .forEach(t => {

      counts[t] =
        (counts[t] || 0) + 1;

    });


  $('chips').innerHTML =

    Object.entries(counts)

    .querySelectorAll('.chip')
    .forEach(chip => {

        $('search').value =

// =========================

function hideSuggest(){
  $('suggest').classList.remove('open');
}

function showSuggest(input, query, onPick){
  const box = $('suggest');
  const q = String(query || '').trim().toLowerCase();

  if(!q){
    hideSuggest();
    return;
  }

  const matches =
    tagList
      .filter(t => t.toLowerCase().includes(q))
      .slice(0, 12);

  if(!matches.length){
    hideSuggest();
    return;
  }

  box.innerHTML =
    matches.map(t =>
      `<button type="button" data-tag="${esc(t)}">#${esc(t)}</button>`
    ).join('');

  const rect = input.getBoundingClientRect();
  box.style.left = `${rect.left}px`;
  box.style.top = `${rect.bottom + 6}px`;
  box.style.width = `${Math.max(200, rect.width)}px`;

  box.querySelectorAll('button').forEach(button => {
    button.onmousedown = e => {
      e.preventDefault();
      onPick(button.dataset.tag);
      hideSuggest();
    };
  });

  box.classList.add('open');
}

window.addEventListener('scroll', hideSuggest, { passive:true });

document
  .querySelector('.side')
  .addEventListener('scroll', hideSuggest, { passive:true });

function esc(s){

  return String(s).replace(
    /[&<>"']/g,

    c => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[c])

  );

}

function renderModalTags(){

  if(!current){
    return;
  }


  const tags =
    Array.isArray(current.tags)
      ? current.tags
      : [];


  $('modalTags').innerHTML =

    tags.length

      ? tags.map((t,index) => {

          const mine = ownsTag(current, t);

          return `
          <span
            class="tag${mine ? '' : ' shared'}"
            title="${mine ? '내가 추가한 태그' : '다른 사람이 추가한 태그 — 수정·삭제할 수 없습니다'}"
          >

            #${esc(t)}

            ${
              mine
                ? `
            <button
              type="button"
              class="remove-tag"
              data-index="${index}"
              title="태그 삭제"
            >
              ×
            </button>
            `
                : ''
            }

          </span>
          `;

        }).join('')

      : `
          <span
            class="hint"
          >
            등록된 태그가 없습니다.
          </span>
        `;


  // 태그 삭제

  document
    .querySelectorAll('.remove-tag')
    .forEach(button => {

      button.onclick = e => {

        // 카드 클릭 이벤트가
        // 같이 실행되지 않도록 함
        e.stopPropagation();


        const index =
          Number(
            button.dataset.index
          );


        if(
          Number.isInteger(index) &&
          index >= 0 &&
          index < current.tags.length
        ){

          current.tags.splice(
            index,
            1
          );


          // 전체 목록에도 반영

          const item =
            items.find(
              x => x.id === current.id
            );


          if(item){
            item.tags = [
              ...current.tags
            ];
          }


          renderModalTags();
          render();

          // 태그 삭제도 즉시 저장
          saveCurrentTags().catch(error => {
            console.error('태그 자동 저장 실패:', error);
            alert(`태그 저장에 실패했습니다.\n\n${error.message || error}`);
          });

        }

      };

    });

}

// =========================
// 이미지 확대 / 축소 / 이동
// 원본 파일은 수정하지 않고 화면 표시만 변경합니다.

function updateZoom(){
  const img = $('big');

  img.style.transform =
    `translate(${panX}px, ${panY}px) scale(${zoom})`;

  $('zoomLevel').textContent =
    `${Math.round(zoom * 100)}%`;
}

function resetZoom(){
  zoom = 1;
  panX = 0;
  panY = 0;
  updateZoom();
}

function changeZoom(amount){
  const next = Math.min(
    5,
    Math.max(
      0.1,
      zoom + amount
    )
  );

  zoom = Math.round(next * 10) / 10;
  updateZoom();
}

$('zoomIn').onclick = () => {
  changeZoom(0.2);
};

$('zoomOut').onclick = () => {
  changeZoom(-0.2);
};

$('zoomReset').onclick = () => {
  resetZoom();
};

$('imageViewer').addEventListener(
  'wheel',
  e => {
    e.preventDefault();

    changeZoom(
      e.deltaY < 0
        ? 0.2
        : -0.2
    );
  },
  { passive:false }
);

$('imageViewer').addEventListener(
  'pointerdown',
  e => {
    if(e.button !== 0){
      return;
    }

    dragging = true;

    dragStartX = e.clientX;
    dragStartY = e.clientY;

    startPanX = panX;
    startPanY = panY;

    $('imageViewer').classList.add('dragging');
    $('imageViewer').setPointerCapture(e.pointerId);
  }
);

$('imageViewer').addEventListener(
  'pointermove',
  e => {
    if(!dragging){
      return;
    }

    panX =
      startPanX +
      (e.clientX - dragStartX);

    panY =
      startPanY +
      (e.clientY - dragStartY);

    updateZoom();
  }
);

function stopDragging(e){
  if(!dragging){
    return;
  }

  dragging = false;

  $('imageViewer').classList.remove('dragging');

  try{
    $('imageViewer').releasePointerCapture(
      e.pointerId
    );
  }catch{}
}

$('imageViewer').addEventListener(
  'pointerup',
  stopDragging
);

$('imageViewer').addEventListener(
  'pointercancel',
  stopDragging
);

// 더블클릭하면 확대/맞춤 전환
$('imageViewer').addEventListener(
  'dblclick',
  () => {
    if(zoom === 1){
      zoom = 2;
      panX = 0;
      panY = 0;
      updateZoom();
    }else{
      resetZoom();
    }
  }
);

async function saveCurrentTags(){
  if(!current){
    return false;
  }

  const tags = [
    ...new Set(
      current.tags
        .map(x => x.trim())
        .filter(Boolean)
    )
  ];

  const target = current;
  const result = await window.tagboxAPI.saveTags(
    target.id,
    tags
  );

  if(!result){
    throw new Error('태그를 저장하지 못했습니다.');
  }

  const index = items.findIndex(
    x => x.id === target.id
  );

  if(index !== -1){
    items[index].tags = [...tags];
  }

  target.tags = [...tags];
  return true;
}

$('addTag').onclick = async () => {

    openAuth();
    return;
  }


  const value =
    $('tagInput')
      .value
      .trim();


  if(!value){
    return;
  }


  // 쉼표로 여러 태그 입력 가능

  const newTags =
    value
      .split(',')
      .map(x => x.trim())
      .filter(Boolean);


  // 기존 태그 + 새 태그
  // 중복 제거

  const before =
    new Set(current.tags);


  current.tags = [
    ...new Set([
      ...current.tags,
      ...newTags
    ])
  ];


  // 새로 추가한 태그만 이 브라우저 소유로 표시

  current.owners =
    current.owners || {};

  current.tags
    .filter(t => !before.has(t))
    .forEach(t => {
      current.owners[t] = String(session.uid);
    });


  // 전체 목록에도 반영

  const item =
    items.find(
      x => x.id === current.id
    );


  if(item){

    item.tags = [
      ...current.tags
    ];

    item.owners = {
      ...current.owners
    };

  }


  // 입력창 비우기

  $('tagInput').value = '';


  // 태그 화면 갱신
  renderModalTags();
  render();

  // 태그 추가 즉시 저장
  try{
    await saveCurrentTags();
  }catch(error){
    console.error('태그 자동 저장 실패:', error);
    alert(`태그 저장에 실패했습니다.\n\n${error.message || error}`);
  }

};

// =========================
// 이미지 → Base64
// =========================

async function prepareUpload(file){
  if (!['image/png','image/jpeg','image/avif'].includes(file.type)) {
    return { type: file.type, base64: await fileToBase64(file) };
  }
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  if (bitmap.close) bitmap.close();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', 0.85));
  if (!blob) throw new Error('WebP 변환에 실패했습니다.');
  if (blob.size > 10 * 1024 * 1024) throw new Error('변환 후 10MB를 넘습니다. 더 작은 이미지를 올려주세요.');
  return { type: 'image/webp', base64: await blobToBase64(blob) };
}
function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        const result =
          reader.result;


        const base64 =
          result.split(',')[1];


        resolve(base64);

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}
